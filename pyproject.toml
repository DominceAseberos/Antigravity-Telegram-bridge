[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "antigravity-telegram-bridge"
version = "2.1.0"
description = "Remote Telegram bridge for Google Antigravity and AGY Terminal Engine"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "DominceAseberos" }
]
keywords = ["antigravity", "telegram", "remote", "ai", "gemini", "cli", "headless"]
dependencies = [
    "requests>=2.31.0",
    "Pillow>=10.0.0",
    "SpeechRecognition>=3.10.0",
    "imageio-ffmpeg>=0.4.9",
    "psutil>=5.9.0"
]

[project.scripts]
antigravity-bridge = "core.cli:main"
agy-bridge = "core.cli:main"
